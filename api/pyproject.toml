[project]
name = "miti-api"
version = "0.1.0"
description = "API de Miti"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "asyncpg>=0.30",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "cryptography>=43",
    "pyjwt>=2.9",
    "aiosmtplib>=3.0",
    "openpyxl>=3.1.2",
    "reportlab>=4.2.0",
    "firebase-admin>=6.5",
    "httpx>=0.27",
    "jinja2>=3.1",
    "pyotp>=2.9",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]
