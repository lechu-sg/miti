name: miti
description: "Miti - campañas de recaudación"
publish_to: "none"
version: 0.6.1+12

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  intl: ^0.20.2
  path_provider: ^2.1.6
  share_plus: ^12.0.2
  image_picker: ^1.2.3
  sqflite: ^2.4.4
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: BigShoulders
      fonts:
        - asset: assets/fuentes/BigShouldersDisplay-Variable.ttf
    - family: Figtree
      fonts:
        - asset: assets/fuentes/Figtree-Variable.ttf
