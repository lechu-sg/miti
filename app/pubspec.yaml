name: miti
description: "Miti - campañas de recaudación"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: BigShoulders
      fonts:
        - asset: assets/fuentes/BigShouldersDisplay-Variable.ttf
    - family: Figtree
      fonts:
        - asset: assets/fuentes/Figtree-Variable.ttf
